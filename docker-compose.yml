name: adzy-workbench

networks:
  adzy_adzy-network:
    external: true

services:
  adzy-workbench:
    container_name: "adzy-workbench-container"
    image: "adzy-workbench-image"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_HOST=postgres
    networks:
      - adzy_adzy-network